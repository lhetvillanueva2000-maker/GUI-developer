name: Release

on:
  push:
    tags: ['v*']
    # A `release/vX.Y.Z` branch triggers the same build. Tag pushes are
    # restricted in some setups (and for some tokens), and shipping a release
    # should not depend on having that particular permission.
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  # ---------------------------------------------------------------------------
  # Work out the version once so every job stamps the same number.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="${{ inputs.version }}" ;;
            *)
              # refs/tags/v1.2.3 -> 1.2.3, refs/heads/release/v1.2.3 -> 1.2.3
              version="${GITHUB_REF_NAME#release/}"
              version="${version#v}"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  # ---------------------------------------------------------------------------
  # Windows: the .exe installer. jpackage can only produce it on Windows.
  # ---------------------------------------------------------------------------
  windows-desktop:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Every Gradle step below is pinned to bash. The Windows default is
    # PowerShell, which splits `-Pmcgui.version=1.0.0` into two arguments, and
    # Gradle then reports a missing task called `.version=1.0.0`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage builds its Windows installers with WiX, and it needs WiX 3.x
      # specifically - the runner images no longer ship it, and the `wix`
      # dotnet tool is v4/v5, which jpackage does not accept.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $dir = "$env:RUNNER_TEMP\wix314"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\candle.exe" -? | Select-Object -First 1

      - name: Build the Windows .exe installer
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseExe

      # The .msi is a nice-to-have alongside the .exe; never fail the release
      # over it.
      - name: Build the Windows .msi package
        continue-on-error: true
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseMsi

      - name: Build the portable Windows jar
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageUberJarForCurrentOS

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktopApp/build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          find desktopApp/build/compose/jars -type f -name '*.jar' -exec cp {} out/ \;
          ls -la out
          # A release without the .exe is not the release we promised.
          if ! ls out/*.exe >/dev/null 2>&1; then
            echo "::error::jpackage did not produce a .exe"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: the .dmg. jpackage can only produce it on macOS, and the bundled
  # runtime plus the Skia natives are architecture-specific, so the installer
  # is per-architecture.
  #
  # Apple Silicon only, deliberately. GitHub retired the `macos-13` Intel image,
  # and a job asking for a runner that no longer exists does not fail - it
  # queues, for hours, holding the entire release behind it. Apple Silicon
  # covers every Mac sold since late 2020; Intel Macs run the portable .jar,
  # which the release notes point them at.
  # ---------------------------------------------------------------------------
  macos-desktop:
    needs: version
    runs-on: macos-14
    # A macOS runner that hangs must not cost the release the four platforms
    # that already built; `bundle` treats this job as optional.
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The .icns can only be built with macOS tooling, so it is generated here
      # rather than committed. The Gradle build picks it up if it exists.
      - name: Build the macOS app icon
        run: |
          chmod +x build-scripts/make-icns.sh
          ./build-scripts/make-icns.sh

      - name: Build the macOS .dmg
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseDmg

      # The .pkg is a nice-to-have alongside the .dmg; never fail the release
      # over it.
      - name: Build the macOS .pkg
        continue-on-error: true
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleasePkg

      - name: Collect the installers
        run: |
          mkdir -p out
          # jpackage names both architectures' output identically, so the arch
          # goes into the file name here - otherwise the second job to upload
          # would overwrite the first and half the Macs would get the wrong
          # binary.
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            cp "$file" "out/${base%.*}-macos-$ARCH.${base##*.}"
          done < <(find desktopApp/build/compose/binaries -type f \( -name '*.dmg' -o -name '*.pkg' \) -print0)
          ls -la out
          # A macOS build without the .dmg is not worth publishing.
          if ! ls out/*.dmg >/dev/null 2>&1; then
            echo "::error::jpackage did not produce a .dmg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: the .deb, and the Android APK.
  # ---------------------------------------------------------------------------
  linux-and-android:
    needs: version
    runs-on: ubuntu-latest
    # Surfaced as job env because the `secrets` context is not available in a
    # step-level `if`, but `env` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # jpackage shells out to these to build a .deb.
      - name: Install the Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Decode the release keystore
        # Optional: set the ANDROID_KEYSTORE_* secrets to get a signed APK.
        # Without them the build still produces an unsigned one.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build-scripts/release.jks
          cat > build-scripts/keystore.properties <<EOF
          storeFile=build-scripts/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate templates and run the tests
        run: ./gradlew "-Pmcgui.version=$VERSION" validateProjects testAll

      # `bundleRelease` produces the .aab Google Play requires; `assembleRelease`
      # produces the .apk people can sideload. They are different artifacts for
      # different audiences, so both are built.
      - name: Build the APK, the AAB and the Linux package
        run: >
          ./gradlew "-Pmcgui.version=$VERSION"
          :androidApp:assembleRelease
          :androidApp:bundleRelease
          :desktopApp:packageReleaseDeb

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out
          find androidApp/build/outputs/apk/release -type f -name '*.apk' -exec cp {} out/ \;
          find androidApp/build/outputs/bundle -type f -name '*.aab' -exec cp {} out/ \;
          find desktopApp/build/compose/binaries -type f -name '*.deb' -exec cp {} out/ \;
          ls -la out
          if ! ls out/*.apk >/dev/null 2>&1; then
            echo "::error::the Android build did not produce an .apk"
            exit 1
          fi
          if ! ls out/*.aab >/dev/null 2>&1; then
            echo "::error::the Android build did not produce an .aab"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-android
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge everything into the single deliverable ZIP and publish the release.
  # ---------------------------------------------------------------------------
  bundle:
    needs: [version, windows-desktop, linux-and-android, macos-desktop]
    # macOS is allowed to fail without sinking the release: Apple's runners are
    # the flakiest of the three and a missing .dmg is a gap, not a reason to
    # withhold the Windows, Linux and Android builds. Windows and Linux are
    # still hard requirements.
    if: >-
      always()
      && needs.version.result == 'success'
      && needs.windows-desktop.result == 'success'
      && needs.linux-and-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build the release ZIP
        run: |
          chmod +x build-scripts/bundle-release.sh
          ./build-scripts/bundle-release.sh artifacts "${{ needs.version.outputs.version }}" dist

      - name: Show what went in
        run: |
          unzip -l dist/*.zip | head -40
          echo
          unzip -p dist/*.zip MANIFEST.txt | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      # Each installer also goes up on its own. The combined ZIP is ~360 MB
      # because every desktop package embeds a Java runtime, and nobody should
      # have to download all four to install one of them.
      - name: Collect the individual installers
        run: |
          mkdir -p standalone
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.apk' \
               -o -name '*.aab' -o -name '*.jar' -o -name '*.dmg' -o -name '*.pkg' \) \
            -exec cp {} standalone/ \;
          ls -la standalone

      # jpackage names its output after the *application*, and the Android
      # build after its Gradle module. Neither is what somebody scanning a
      # release page needs to see, so the downloads are given the name of the
      # thing they actually are, once, here - rather than in each of the three
      # build jobs, where they would drift apart.
      #
      # The .jar and the .aab are deliberately not called installers: one is
      # the app itself and the other is an upload for Google Play. Calling
      # either an installer would send somebody to the wrong file.
      - name: Name the downloads
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd standalone
          rename_to() {
            [ "$1" = "$2" ] && return 0
            mv -- "$1" "$2"
          }
          for file in *; do
            case "$file" in
              *.exe) rename_to "$file" "UILabsInstaller-$VERSION.exe" ;;
              *.msi) rename_to "$file" "UILabsInstaller-$VERSION.msi" ;;
              *.deb) rename_to "$file" "UILabsInstaller-$VERSION-amd64.deb" ;;
              *.apk) rename_to "$file" "UILabsInstaller-$VERSION.apk" ;;
              *.dmg) rename_to "$file" "UILabsInstaller-$VERSION-macos-aarch64.dmg" ;;
              *.pkg) rename_to "$file" "UILabsInstaller-$VERSION-macos-aarch64.pkg" ;;
              *.aab) rename_to "$file" "UILabs-$VERSION.aab" ;;
              *.jar) rename_to "$file" "UILabs-$VERSION.jar" ;;
            esac
          done
          ls -la

      # Releases published in error, withdrawn so the version history reads in
      # order. Normally empty - it is filled in for exactly one run and cleared
      # again afterwards, which is why it is a literal here rather than an input:
      # deleting a published release is not something a workflow should be able
      # to be talked into doing casually.
      - name: Retire superseded releases
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          RETIRE_TAGS: ""
        run: |
          for tag in $RETIRE_TAGS; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "retiring $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

      # Assets otherwise accumulate across re-cuts: a release republished after
      # a rename keeps the old file names alongside the new ones, because
      # --clobber only replaces an asset of the *same* name. What is attached to
      # a release should be exactly what this build produced and nothing else.
      - name: Clear assets already attached to this tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
            done
          fi

      # The GitHub CLI is preinstalled on the runner, so publishing needs no
      # third-party action.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## UILabs $VERSION

          ### Get it

          | Platform | Download |
          | --- | --- |
          | **Windows** | \`UILabsInstaller-$VERSION.exe\` — installer, no Java needed |
          | **macOS (Apple Silicon)** | \`UILabsInstaller-$VERSION-macos-aarch64.dmg\` — every Mac since late 2020 |
          | **Android** | \`UILabsInstaller-$VERSION.apk\` — allow "install from unknown sources" when prompted |
          | **Linux** | \`UILabsInstaller-$VERSION-amd64.deb\` |
          | **Any OS with a JVM** | \`UILabs-$VERSION.jar\` — \`java -jar <file>\` |
          | **Google Play** | \`UILabs-$VERSION.aab\` — for uploading to Play, **not** installable on a phone |
          | **Everything at once** | \`uilabs-$VERSION.zip\` — every installer above, plus templates, docs and full source |

          Each desktop package embeds its own Java runtime, so nothing has to be installed
          first — which is also why they are ~90-110 MB each.

          Upgrading is a normal install over the top on every platform, including
          Android — this build carries the same signing key as 1.5.0.

          ---

          ## What's new in $VERSION

          ### Resize handles follow the angle

          Turn an element and its handles now sit on the corners it actually has,
          drawn at the same angle, rather than staying square to the screen however
          far round it had gone. Dragging one resizes along the element's *own* axes
          — on a quarter turn, the handle on the right points down the screen, so a
          downward drag makes it wider — and the corner opposite the one you are
          dragging stays where it looks like it is instead of sliding away.

          ### Any angle you like

          A round knob sits above the selection. Drag it and the element follows your
          pointer exactly; hold **Shift** to snap to 15°, and on a touchscreen it
          snaps on its own since there is no modifier key to ask with. The inspector
          has a **Rotation** field that takes any whole angle from 0 to 359, with the
          useful ones a click away. The 90° buttons are still there.

          ### Rotation applies to everything now

          It used to be applied by exactly one renderer, so it was quietly a
          shapes-only feature: turning a button did nothing on the canvas while the
          exports emitted a rotation anyway. Rotation is now one transform applied
          once, for every element of both editions — on the canvas, in the picture
          export, and in all five code exports.

          ### Colours to pick from

          Every colour field has a palette under it:

          - **Minecraft** — panel, slot and button greys, tooltip purple, dirt, oak,
            stone, deepslate, XP green and health red, measured off the real widgets.
            Getting these right by eye is close to impossible, and a panel four greys
            off looks wrong without looking *obviously* wrong.
          - **Greys** — a neutral ramp from white to black.
          - **Colours** — fourteen hues at three lightnesses each.

          Picking a swatch keeps the alpha you already set. The hex field still takes
          anything at all.

          ### Fixes

          - **A turned element exported square to SVG.** The rotate transform was
            written inside the custom-shape branch of the generator, so everything
            else came out flat.
          - **The same, in CSS.** The rotation line lived inside the shape-only rules.
          - **A turned element came back straight from a Bedrock round trip.** The
            angle was written only for shapes, and the importer never read it at all.
          - **Shapes turned twice as far as anything else** once rotation moved to
            the shared path, and their labels stayed upright while the shape leaned.

          ---

          ### First launch notes

          **macOS.** The \`.dmg\` is not signed with an Apple Developer certificate, so
          Gatekeeper blocks the first launch with *"cannot be opened because the developer
          cannot be verified"*. Open it once with **right-click → Open**, or clear the
          quarantine flag:

          \`\`\`
          xattr -dr com.apple.quarantine "/Applications/UILabs.app"
          \`\`\`

          Every launch after that is normal. The \`.dmg\` is Apple Silicon only; on an Intel
          Mac use the portable \`.jar\` with \`java -jar\` (Java 17+).

          **Android.** Play Protect will offer to scan the APK before installing it. That
          prompt appears for anything installed outside the Play Store, whatever it is
          signed with, and the only thing that removes it is publishing on Play itself.

          **Windows.** SmartScreen warns that the publisher is unknown. Choose **More
          info → Run anyway**. Removing that warning needs a paid code-signing
          certificate from a commercial CA; this project does not have one.

          ### Inside the combined ZIP

          | Folder | Contents |
          | --- | --- |
          | \`desktop/\` | Windows \`.exe\` and \`.msi\`, macOS \`.dmg\` and \`.pkg\`, Linux \`.deb\`, portable \`.jar\` |
          | \`android/\` | The APK and the Play Store \`.aab\` |
          | \`templates/\` | Bundled \`.mcgui\` templates plus a full set of sample exports |
          | \`docs/\` | Architecture, project format, editor guide and export documentation |
          | \`build-scripts/\` | The scripts that produced this archive |
          | \`source.zip\` | The complete source tree, including the Gradle build |

          \`MANIFEST.txt\` inside the archive lists every file with its SHA-256.
          EOF
          # From a release branch there is no tag yet; gh creates one at this
          # commit. From a tag push the tag already exists and --target is a
          # no-op.
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip standalone/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "UILabs $VERSION" \
              --notes-file notes.md \
              dist/*.zip standalone/*
          fi
