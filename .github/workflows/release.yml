name: Release

on:
  push:
    tags: ['v*']
    # A `release/vX.Y.Z` branch triggers the same build. Tag pushes are
    # restricted in some setups (and for some tokens), and shipping a release
    # should not depend on having that particular permission.
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  # ---------------------------------------------------------------------------
  # Work out the version once so every job stamps the same number.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="${{ inputs.version }}" ;;
            *)
              # refs/tags/v1.2.3 -> 1.2.3, refs/heads/release/v1.2.3 -> 1.2.3
              version="${GITHUB_REF_NAME#release/}"
              version="${version#v}"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  # ---------------------------------------------------------------------------
  # Windows: the .exe installer. jpackage can only produce it on Windows.
  # ---------------------------------------------------------------------------
  windows-desktop:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Every Gradle step below is pinned to bash. The Windows default is
    # PowerShell, which splits `-Pmcgui.version=1.0.0` into two arguments, and
    # Gradle then reports a missing task called `.version=1.0.0`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage builds its Windows installers with WiX, and it needs WiX 3.x
      # specifically - the runner images no longer ship it, and the `wix`
      # dotnet tool is v4/v5, which jpackage does not accept.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $dir = "$env:RUNNER_TEMP\wix314"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\candle.exe" -? | Select-Object -First 1

      - name: Build the Windows .exe installer
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseExe

      # The .msi is a nice-to-have alongside the .exe; never fail the release
      # over it.
      - name: Build the Windows .msi package
        continue-on-error: true
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseMsi

      - name: Build the portable Windows jar
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageUberJarForCurrentOS

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktopApp/build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          find desktopApp/build/compose/jars -type f -name '*.jar' -exec cp {} out/ \;
          ls -la out
          # A release without the .exe is not the release we promised.
          if ! ls out/*.exe >/dev/null 2>&1; then
            echo "::error::jpackage did not produce a .exe"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: the .deb, and the Android APK.
  # ---------------------------------------------------------------------------
  linux-and-android:
    needs: version
    runs-on: ubuntu-latest
    # Surfaced as job env because the `secrets` context is not available in a
    # step-level `if`, but `env` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # jpackage shells out to these to build a .deb.
      - name: Install the Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Decode the release keystore
        # Optional: set the ANDROID_KEYSTORE_* secrets to get a signed APK.
        # Without them the build still produces an unsigned one.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build-scripts/release.jks
          cat > build-scripts/keystore.properties <<EOF
          storeFile=build-scripts/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate templates and run the tests
        run: ./gradlew "-Pmcgui.version=$VERSION" validateProjects testAll

      # No `bundleRelease`. The .aab it produces is only useful for uploading
      # to Google Play, this app is not published there, and an artifact nobody
      # can install is a thing people download by mistake and then report as
      # broken. If it is ever published, the line comes back.
      # `assembleDebug` is built alongside the shipping artifacts on purpose.
      # It carries its own applicationId, so it installs beside the real app
      # rather than over it, and it is the build that can show a crash's actual
      # text on screen where it can be copied. A test build that lags the
      # release is worse than none, so it is cut from the same commit.
      - name: Build the APK, the test build and the Linux package
        run: >
          ./gradlew "-Pmcgui.version=$VERSION"
          :androidApp:assembleRelease
          :androidApp:assembleDebug
          :desktopApp:packageReleaseDeb

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out
          find androidApp/build/outputs/apk/release -type f -name '*.apk' -exec cp {} out/ \;
          # Renamed on the way out: both are "androidApp-*.apk" in the build
          # tree, and two files whose names differ only by a build type is how
          # somebody installs the wrong one and reports the wrong result.
          for debug in androidApp/build/outputs/apk/debug/*.apk; do
            [ -e "$debug" ] && cp "$debug" "out/UILabsDebug-$VERSION.apk"
          done
          find desktopApp/build/compose/binaries -type f -name '*.deb' -exec cp {} out/ \;
          ls -la out
          if ! ls out/*.apk >/dev/null 2>&1; then
            echo "::error::the Android build did not produce an .apk"
            exit 1
          fi
          if ! ls out/UILabsDebug-*.apk >/dev/null 2>&1; then
            echo "::error::the Android build did not produce a test build"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-android
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge everything into the single deliverable ZIP and publish the release.
  # ---------------------------------------------------------------------------
  bundle:
    needs: [version, windows-desktop, linux-and-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build the release ZIP
        run: |
          chmod +x build-scripts/bundle-release.sh
          ./build-scripts/bundle-release.sh artifacts "${{ needs.version.outputs.version }}" dist

      - name: Show what went in
        run: |
          unzip -l dist/*.zip | head -40
          echo
          unzip -p dist/*.zip MANIFEST.txt | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      # Each installer also goes up on its own. The combined ZIP is ~360 MB
      # because every desktop package embeds a Java runtime, and nobody should
      # have to download all four to install one of them.
      - name: Collect the individual installers
        run: |
          mkdir -p standalone
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.apk' \
               -o -name '*.jar' \) \
            -exec cp {} standalone/ \;
          ls -la standalone

      # jpackage names its output after the *application*, and the Android
      # build after its Gradle module. Neither is what somebody scanning a
      # release page needs to see, so the downloads are given the name of the
      # thing they actually are, once, here - rather than in each of the three
      # build jobs, where they would drift apart.
      #
      # The .jar is deliberately not called an installer: it installs nothing,
      # it is the app itself, run in place by a JVM. Calling it one would send
      # somebody looking for a setup wizard that does not exist.
      - name: Name the downloads
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd standalone
          rename_to() {
            [ "$1" = "$2" ] && return 0
            mv -- "$1" "$2"
          }
          for file in *; do
            case "$file" in
              *.exe) rename_to "$file" "UILabsInstaller-$VERSION.exe" ;;
              *.msi) rename_to "$file" "UILabsInstaller-$VERSION.msi" ;;
              *.deb) rename_to "$file" "UILabsInstaller-$VERSION-amd64.deb" ;;
              UILabsDebug-*.apk) ;;  # already named, and not an installer
              *.apk) rename_to "$file" "UILabsInstaller-$VERSION.apk" ;;
              *.jar) rename_to "$file" "UILabs-$VERSION.jar" ;;
            esac
          done
          ls -la

      # Releases published in error, withdrawn so the version history reads in
      # order. Normally empty - it is filled in for exactly one run and cleared
      # again afterwards, which is why it is a literal here rather than an input:
      # deleting a published release is not something a workflow should be able
      # to be talked into doing casually.
      - name: Retire superseded releases
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          RETIRE_TAGS: ""
        run: |
          for tag in $RETIRE_TAGS; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "retiring $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done

      # Assets otherwise accumulate across re-cuts: a release republished after
      # a rename keeps the old file names alongside the new ones, because
      # --clobber only replaces an asset of the *same* name. What is attached to
      # a release should be exactly what this build produced and nothing else.
      - name: Clear assets already attached to this tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$tag" "$asset" --yes
            done
          fi

      # The GitHub CLI is preinstalled on the runner, so publishing needs no
      # third-party action.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## UILabs $VERSION

          ### Get it

          | Platform | Download |
          | --- | --- |
          | **Windows** | \`UILabsInstaller-$VERSION.exe\` — installer, no Java needed |
          | **Android** | \`UILabsInstaller-$VERSION.apk\` — allow "install from unknown sources" when prompted |
          | **Android (test build)** | \`UILabsDebug-$VERSION.apk\` — installs *alongside* the one above, shows errors you can copy |
          | **Linux** | \`UILabsInstaller-$VERSION-amd64.deb\` |
          | **macOS, or any OS with a JVM** | \`UILabs-$VERSION.jar\` — \`java -jar <file>\`, Java 17+ |
          | **Everything at once** | \`uilabs-$VERSION.zip\` — every installer above, plus templates, docs and full source |

          Each desktop package embeds its own Java runtime, so nothing has to be installed
          first — which is also why they are ~90-110 MB each.

          **No macOS installer from this release on.** A \`.dmg\` that is not signed with
          an Apple Developer certificate is blocked by Gatekeeper on first launch, and
          shipping an installer whose instructions begin "right-click, then Open, then
          confirm you meant it" is worse than not shipping one. The app itself runs on a
          Mac perfectly well — use the portable \`.jar\` above, which needs Java 17 and no
          ceremony, and works on Intel and Apple Silicon alike.

          Upgrading is a normal install over the top on every platform, including
          Android — this build carries the same signing key as 1.5.0.

          ---

          ## What's new in $VERSION

          ### The preview runs

          The **Preview** tab is now **Preview / Demo**, and the screen in it
          actually works.

          Press a button and it presses — and sliding off it before you let go
          cancels it, the way every real button behaves. Toggles flip.
          Checkboxes tick. A tab deselects its neighbours, which is the thing
          that makes a tab strip a tab strip and the thing a still preview
          always gets wrong. Dropdowns cycle through every option. Sliders jump
          to where you tap and then follow your finger. Text fields take the
          keyboard and keep what you type, and a search field's clear cross
          clears it. Lists scroll — on the wheel, or by dragging — and stop at
          their ends. The whole screen pinches and wheels to any zoom.

          The reason to open a preview is to find out whether the layout works
          when somebody *uses* it: is that button big enough to hit, does the
          list reach its last row, is the switch obviously on when it is on,
          does the layout still hold once the text field has something in it.
          None of that is visible in a picture, and all of it is visible the
          moment the screen responds.

          **Nothing the demo does touches the document.** Every change lives in
          a layer over the top, so pressing a button in a preview does not
          dirty the project, does not enter the undo history, and does not
          survive **Reset**. The five state buttons are still beside **Live**
          for pinning *every* widget to hover, or pressed, or disabled at once
          — which is the only way to inspect a skin you drew, since no amount
          of pointing at one widget will show you the rest.

          ### A ruler in the paint canvas — nine of them

          A ruler is not a tool you draw with. It is a thing you put down and
          then draw *against*, and everything drawn while it is there comes out
          straight, or round, or converging on a vanishing point. On a
          touchscreen that is the difference between line art being possible
          and not.

          | Ruler | What it does |
          | --- | --- |
          | **Straight edge** | every stroke lands on one line |
          | **Parallel** | each stroke becomes its own line at the ruler's angle |
          | **Cross** | each stroke locks to whichever axis it set off along |
          | **Circle** | each stroke rides the circle it started on |
          | **Ellipse** | the same, squashed — a circle seen at an angle |
          | **Radial** | strokes run out from the centre along the nearest spoke |
          | **1, 2, 3-point** | perspective |

          They all work the same way, and it is the part worth knowing: the
          snap is onto the shape **through the point the stroke began at**. You
          choose which of the parallel lines, or which concentric circle, by
          where you start — the ruler only decides the direction. Snapping to
          one fixed line instead would mean moving the ruler between every
          stroke.

          Symmetry still composes with all of it: a mirrored stroke held to a
          ruler is mirrored and held.

          ### A real selection

          Three ways to make one — a **box or ellipse marquee**, a freehand
          **lasso**, and a **magic wand** — then **expand**, **contract**,
          **soften**, **invert**, **all**, **none** and *everything on this
          layer*, with **New / Add / Subtract / Intersect** deciding how the
          next one meets the last. That is a setting rather than a modifier
          key, because there is no modifier key on a phone.

          The lasso closes its own loop, so letting go without carefully
          returning to the start still gives you a region. The wand runs the
          same flood the bucket does, deliberately: "what would the bucket
          fill" and "what does the wand select" have to be the same question,
          or the two tools contradict each other.

          And then the part that matters. **Everything** is confined to it: the
          brush, the eraser, the bucket, blur, smudge, fill, clear and the auto
          cutout. A selection that only some tools respect is worse than no
          selection at all, because it teaches you not to trust it. Because it
          is stored as coverage rather than as a shape, a **softened** selection
          *fades* what you draw into it instead of cutting it off at a line.

          ### The canvas zooms four times deeper

          To **64x**, up from 16. These canvases are tiny — a Java chest screen
          is 176 by 166 — so the unit of work is one pixel, and at 16x a pixel
          was about the size of a full stop at arm's length and smaller than
          the fingertip aiming at it. At 64x it is a large tile whose halves
          are unambiguous.

          ### Fixes

          - **Scroll containers never clipped their contents.** The element has
            always been described as a clipped, scrollable region and the
            renderer drew all of it: a twelve-row list in a six-row window
            painted twelve rows, straight over whatever was laid out beneath
            it. So the one element whose whole purpose is holding more than it
            can show was the one element that could not show that.
          - **Every scrollbar thumb was pinned to the top of its track**,
            whatever the region was scrolled to — in all three skins. They now
            all draw it from one shared calculation.
          - **The grid cost more the further you zoomed in**, because it walked
            the whole sheet from its corner and most of the loop drew lines
            outside the window that were then thrown away.
          - **The desktop / mobile switch is gone.** It decided a starting
            canvas size and whether the safe-area overlay was drawn, and it had
            spread to fourteen files to do it. A safe area is a margin the
            design must keep clear — a phone's rounded corners are the usual
            reason to want one, but a TV's overscan and a window's title bar
            are the same problem — so it now follows whether a margin has
            actually been set. **Projects saved by older versions still open.**

          ### First launch notes

          **Android.** Play Protect will offer to scan the APK before installing it. That
          prompt appears for anything installed outside the Play Store, whatever it is
          signed with, and the only thing that removes it is publishing on Play itself.

          **Windows.** SmartScreen warns that the publisher is unknown. Choose **More
          info → Run anyway**. Removing that warning needs a paid code-signing
          certificate from a commercial CA; this project does not have one.

          ### Inside the combined ZIP

          | Folder | Contents |
          | --- | --- |
          | \`desktop/\` | Windows \`.exe\` and \`.msi\`, Linux \`.deb\`, portable \`.jar\` |
          | \`android/\` | The APK and the test build |
          | \`templates/\` | Bundled \`.mcgui\` templates plus a full set of sample exports |
          | \`docs/\` | Architecture, project format, editor guide and export documentation |
          | \`build-scripts/\` | The scripts that produced this archive |
          | \`source.zip\` | The complete source tree, including the Gradle build |

          \`MANIFEST.txt\` inside the archive lists every file with its SHA-256.
          EOF
          # From a release branch there is no tag yet; gh creates one at this
          # commit. From a tag push the tag already exists and --target is a
          # no-op.
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip standalone/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "UILabs $VERSION" \
              --notes-file notes.md \
              dist/*.zip standalone/*
          fi
