name: Release

on:
  push:
    tags: ['v*']
    # A `release/vX.Y.Z` branch triggers the same build. Tag pushes are
    # restricted in some setups (and for some tokens), and shipping a release
    # should not depend on having that particular permission.
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  # ---------------------------------------------------------------------------
  # Work out the version once so every job stamps the same number.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) version="${{ inputs.version }}" ;;
            *)
              # refs/tags/v1.2.3 -> 1.2.3, refs/heads/release/v1.2.3 -> 1.2.3
              version="${GITHUB_REF_NAME#release/}"
              version="${version#v}"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  # ---------------------------------------------------------------------------
  # Windows: the .exe installer. jpackage can only produce it on Windows.
  # ---------------------------------------------------------------------------
  windows-desktop:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Every Gradle step below is pinned to bash. The Windows default is
    # PowerShell, which splits `-Pmcgui.version=1.0.0` into two arguments, and
    # Gradle then reports a missing task called `.version=1.0.0`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # jpackage builds its Windows installers with WiX, and it needs WiX 3.x
      # specifically - the runner images no longer ship it, and the `wix`
      # dotnet tool is v4/v5, which jpackage does not accept.
      - name: Install WiX Toolset 3.14
        shell: pwsh
        run: |
          $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $dir = "$env:RUNNER_TEMP\wix314"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\candle.exe" -? | Select-Object -First 1

      - name: Build the Windows .exe installer
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseExe

      # The .msi is a nice-to-have alongside the .exe; never fail the release
      # over it.
      - name: Build the Windows .msi package
        continue-on-error: true
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseMsi

      - name: Build the portable Windows jar
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageUberJarForCurrentOS

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p out
          find desktopApp/build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp {} out/ \;
          find desktopApp/build/compose/jars -type f -name '*.jar' -exec cp {} out/ \;
          ls -la out
          # A release without the .exe is not the release we promised.
          if ! ls out/*.exe >/dev/null 2>&1; then
            echo "::error::jpackage did not produce a .exe"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: the .dmg. jpackage can only produce it on macOS, and the bundled
  # runtime plus the Skia natives are architecture-specific, so the installer
  # is per-architecture.
  #
  # Apple Silicon only, deliberately. GitHub retired the `macos-13` Intel image,
  # and a job asking for a runner that no longer exists does not fail - it
  # queues, for hours, holding the entire release behind it. Apple Silicon
  # covers every Mac sold since late 2020; Intel Macs run the portable .jar,
  # which the release notes point them at.
  # ---------------------------------------------------------------------------
  macos-desktop:
    needs: version
    runs-on: macos-14
    # A macOS runner that hangs must not cost the release the four platforms
    # that already built; `bundle` treats this job as optional.
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The .icns can only be built with macOS tooling, so it is generated here
      # rather than committed. The Gradle build picks it up if it exists.
      - name: Build the macOS app icon
        run: |
          chmod +x build-scripts/make-icns.sh
          ./build-scripts/make-icns.sh

      - name: Build the macOS .dmg
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleaseDmg

      # The .pkg is a nice-to-have alongside the .dmg; never fail the release
      # over it.
      - name: Build the macOS .pkg
        continue-on-error: true
        run: ./gradlew -PskipAndroid=true "-Pmcgui.version=$VERSION" :desktopApp:packageReleasePkg

      - name: Collect the installers
        run: |
          mkdir -p out
          # jpackage names both architectures' output identically, so the arch
          # goes into the file name here - otherwise the second job to upload
          # would overwrite the first and half the Macs would get the wrong
          # binary.
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            cp "$file" "out/${base%.*}-macos-$ARCH.${base##*.}"
          done < <(find desktopApp/build/compose/binaries -type f \( -name '*.dmg' -o -name '*.pkg' \) -print0)
          ls -la out
          # A macOS build without the .dmg is not worth publishing.
          if ! ls out/*.dmg >/dev/null 2>&1; then
            echo "::error::jpackage did not produce a .dmg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: the .deb, and the Android APK.
  # ---------------------------------------------------------------------------
  linux-and-android:
    needs: version
    runs-on: ubuntu-latest
    # Surfaced as job env because the `secrets` context is not available in a
    # step-level `if`, but `env` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      # jpackage shells out to these to build a .deb.
      - name: Install the Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Decode the release keystore
        # Optional: set the ANDROID_KEYSTORE_* secrets to get a signed APK.
        # Without them the build still produces an unsigned one.
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build-scripts/release.jks
          cat > build-scripts/keystore.properties <<EOF
          storeFile=build-scripts/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Validate templates and run the tests
        run: ./gradlew "-Pmcgui.version=$VERSION" validateProjects testAll

      # `bundleRelease` produces the .aab Google Play requires; `assembleRelease`
      # produces the .apk people can sideload. They are different artifacts for
      # different audiences, so both are built.
      - name: Build the APK, the AAB and the Linux package
        run: >
          ./gradlew "-Pmcgui.version=$VERSION"
          :androidApp:assembleRelease
          :androidApp:bundleRelease
          :desktopApp:packageReleaseDeb

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out
          find androidApp/build/outputs/apk/release -type f -name '*.apk' -exec cp {} out/ \;
          find androidApp/build/outputs/bundle -type f -name '*.aab' -exec cp {} out/ \;
          find desktopApp/build/compose/binaries -type f -name '*.deb' -exec cp {} out/ \;
          ls -la out
          if ! ls out/*.apk >/dev/null 2>&1; then
            echo "::error::the Android build did not produce an .apk"
            exit 1
          fi
          if ! ls out/*.aab >/dev/null 2>&1; then
            echo "::error::the Android build did not produce an .aab"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-android
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge everything into the single deliverable ZIP and publish the release.
  # ---------------------------------------------------------------------------
  bundle:
    needs: [version, windows-desktop, linux-and-android, macos-desktop]
    # macOS is allowed to fail without sinking the release: Apple's runners are
    # the flakiest of the three and a missing .dmg is a gap, not a reason to
    # withhold the Windows, Linux and Android builds. Windows and Linux are
    # still hard requirements.
    if: >-
      always()
      && needs.version.result == 'success'
      && needs.windows-desktop.result == 'success'
      && needs.linux-and-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download every build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build the release ZIP
        run: |
          chmod +x build-scripts/bundle-release.sh
          ./build-scripts/bundle-release.sh artifacts "${{ needs.version.outputs.version }}" dist

      - name: Show what went in
        run: |
          unzip -l dist/*.zip | head -40
          echo
          unzip -p dist/*.zip MANIFEST.txt | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

      # Each installer also goes up on its own. The combined ZIP is ~360 MB
      # because every desktop package embeds a Java runtime, and nobody should
      # have to download all four to install one of them.
      - name: Collect the individual installers
        run: |
          mkdir -p standalone
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.apk' \
               -o -name '*.aab' -o -name '*.jar' -o -name '*.dmg' -o -name '*.pkg' \) \
            -exec cp {} standalone/ \;
          ls -la standalone

      # The GitHub CLI is preinstalled on the runner, so publishing needs no
      # third-party action.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Minecraft GUI Designer $VERSION

          ### Get it

          | Platform | Download |
          | --- | --- |
          | **Windows** | \`MinecraftGuiDesigner-$VERSION.exe\` — installer, no Java needed |
          | **macOS (Apple Silicon)** | \`MinecraftGuiDesigner-$VERSION-macos-aarch64.dmg\` — every Mac since late 2020 |
          | **Android** | \`androidApp-release.apk\` — allow "install from unknown sources" when prompted |
          | **Linux** | \`minecraft-gui-designer_$VERSION-1_amd64.deb\` |
          | **Any OS with a JVM** | \`MinecraftGuiDesigner-windows-x64-$VERSION.jar\` — \`java -jar <file>\` |
          | **Google Play** | \`androidApp-release.aab\` — for uploading to Play, **not** installable on a phone |
          | **Everything at once** | \`minecraft-gui-designer-$VERSION.zip\` — every installer above, plus templates, docs and full source |

          Each desktop package embeds its own Java runtime, so nothing has to be installed
          first — which is also why they are ~90-110 MB each.

          Upgrading from 1.4.0 is a normal install over the top on every platform.

          ---

          ## What's new in $VERSION

          The app opens somewhere new. Java and Bedrock are no longer two tabs inside
          the editor — they are two cards on a home screen, and you pick one before the
          editor exists.

          ### A home screen

          Each card is a real container from its own edition, holding real slots and a
          real button, drawn entirely from that edition's palette. Java comes out flat,
          square and hard-edged; Bedrock comes out soft-cornered with a 2px
          light-over-dark border. They are deliberately not reconciled with each other,
          because the difference between them is the thing being chosen.

          Home has no edition of its own, so it wears the chrome of whichever card you
          are hovering — the whole shell repaints as you move between them, and the app
          changes identity before you commit to anything. The backdrop is drawn in code
          rather than loaded, so it retints with it.

          **J**, **B** and **T** open Java, open Bedrock and cycle the theme.

          ### The edition tabs have left the editor

          The header reports which edition you are in instead of offering to change it,
          and the arrow at its top left goes back to the picker. Nothing about the open
          document is lost on the way there or back — picking the other edition converts
          what you have rather than replacing it, and reports anything the new edition
          cannot express.

          | | |
          | --- | --- |
          | **Desktop** | Arrow at the top left, or **Escape** |
          | **Tablet** | Arrow in the tool row |
          | **Phone** | The system back gesture |

          Escape unwinds one step at a time, the same order Android's back gesture uses:
          it cancels an armed placement first, then clears a selection, and only leaves
          the editor when there is nothing left inside it to dismiss.

          ### A what's-new strip

          Where the edition tabs used to be. Collapsed it is one line; pull it down and
          it lists the detail. On a phone that is a downward swipe anywhere on the strip;
          on a desktop it is the chevron on the right. Both work everywhere — a gesture
          nobody can see is not an affordance, and a small target is not a good one for a
          thumb.

          ### Support moved to home

          The hand-and-heart mark now sits at the top right of the home screen, and that
          is its only home. It still carries the InstaPay / QR Ph code, the same details
          as copyable text, and the list of every app that can pay it. Press and hold the
          code — or use the button — to save it.

          Still the whole of the app's monetisation: no ads, no paywall, no account, no
          telemetry.

          ### Fixes

          - The welcome dialog no longer opens on startup. Home already asks which
            edition you want, and two front doors in a row is one front door too many.
            It is still on the Help menu.
          - A session recovered after a crash, or restored after Android killed the
            process, goes straight back to the editor instead of stopping at the picker.
          - Four faults in the merged home-screen sources, found on the way in: the two
            cards were fighting over which one repainted the shell, the card's hover was
            wired to a source nothing was listening to, the keyboard shortcuts were
            advertised on a node that never held focus, and the content column asked for
            a full screen height underneath a bar that had already taken 56dp of it.

          ---


          ### First launch notes

          **macOS.** The \`.dmg\` is not signed with an Apple Developer certificate, so
          Gatekeeper blocks the first launch with *"cannot be opened because the developer
          cannot be verified"*. Open it once with **right-click → Open**, or clear the
          quarantine flag:

          \`\`\`
          xattr -dr com.apple.quarantine "/Applications/MinecraftGuiDesigner.app"
          \`\`\`

          Every launch after that is normal. The \`.dmg\` is Apple Silicon only; on an Intel
          Mac use the portable \`.jar\` with \`java -jar\` (Java 17+).

          **Android.** The APK is signed with the repository's development key, which makes
          it installable and upgradeable but is not a publishing key — see
          \`build-scripts/README.md\`.

          ### Inside the combined ZIP

          | Folder | Contents |
          | --- | --- |
          | \`desktop/\` | Windows \`.exe\` and \`.msi\`, macOS \`.dmg\` and \`.pkg\`, Linux \`.deb\`, portable \`.jar\` |
          | \`android/\` | The APK and the Play Store \`.aab\` |
          | \`templates/\` | Bundled \`.mcgui\` templates plus a full set of sample exports |
          | \`docs/\` | Architecture, project format, editor guide and export documentation |
          | \`build-scripts/\` | The scripts that produced this archive |
          | \`source.zip\` | The complete source tree, including the Gradle build |

          \`MANIFEST.txt\` inside the archive lists every file with its SHA-256.
          EOF
          # From a release branch there is no tag yet; gh creates one at this
          # commit. From a tag push the tag already exists and --target is a
          # no-op.
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip standalone/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Minecraft GUI Designer $VERSION" \
              --notes-file notes.md \
              dist/*.zip standalone/*
          fi
